services:
  # Applique les migrations Prisma en attente, puis s'arrête. `web` ne démarre
  # qu'après son succès : si une migration échoue, le déploiement s'arrête là
  # et l'ancien conteneur du site continue de tourner. `migrate deploy`
  # n'applique que ce qui manque et ne réinitialise jamais la base.
  # Image = l'étape `builder` du Dockerfile (déjà construite pour `web`, donc
  # tirée du cache) : c'est elle qui contient le CLI Prisma et les migrations.
  migrate:
    build:
      context: .
      target: builder
    command: ["pnpm", "prisma", "migrate", "deploy"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    networks:
      - dokploy-network

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_SOCKET_SECRET: ${NEXT_PUBLIC_SOCKET_SECRET}
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Toutes les variables saisies dans Dokploy arrivent dans le conteneur.
    # Le compose de bot-engine ne transmettait que DATABASE_URL : on évite de
    # reproduire ce piège ici.
    env_file:
      - path: .env
        required: false
    environment:
      # next-auth v5 refuse les requêtes relayées par un proxy qu'il ne connaît
      # pas. Vercel le règle tout seul, derrière Traefik il faut l'autoriser.
      AUTH_TRUST_HOST: "true"
    # Pas de section `ports` : Traefik route en interne vers le port 3000.
    # Réseau partagé de Dokploy : Traefik y route le trafic, et c'est par lui
    # que le site joint la base Postgres hébergée sur le même VPS.
    networks:
      - dokploy-network
    # Plafond mémoire : le site partage le VPS avec bot-engine, il ne doit
    # jamais pouvoir l'étouffer.
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  dokploy-network:
    external: true
